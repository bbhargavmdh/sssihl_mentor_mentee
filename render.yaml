services:
  - type: web
    name: sssihl-mentor-mentee
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --workers 3 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sssihl-mentor-mentee-db
          property: connectionString
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "SSSIHL Mentoring <no-reply@sssihl.edu.in>"
      - key: DEFAULT_USER_PASSWORD
        value: "Welcome@123"

databases:
  - name: sssihl-mentor-mentee-db
    plan: free
