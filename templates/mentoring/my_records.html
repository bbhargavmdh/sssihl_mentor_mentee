{% extends "base.html" %}
{% block content %}
<h4>My Mentoring Reports</h4>
<table class="table table-bordered bg-white">
  <thead><tr><th>Meeting Date</th><th>Mentor</th><th>PDF</th></tr></thead>
  <tbody>
  {% for r in page_obj %}
    <tr>
      <td>{{ r.meeting.meeting_date }}</td>
      <td>{{ r.mentor.user.get_full_name }}</td>
      <td><a href="{% url 'mentoring:record_pdf' r.pk %}" class="btn btn-sm btn-outline-success">Download</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="3" class="text-center text-muted">No reports yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% include "core/_pagination.html" %}
{% endblock %}
