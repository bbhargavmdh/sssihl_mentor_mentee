{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5>Set a New Password</h5>
        <p class="text-muted">For security, you must change your password before continuing.</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-sssihl">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
