{% extends "base.html" %}
{% block content %}
<h4>{{ title }}</h4>
<p class="text-muted">Expected columns: {{ columns }}</p>
<form method="post" enctype="multipart/form-data" class="card p-4" style="max-width:500px;">
  {% csrf_token %}
  {{ form.excel_file }}
  <button type="submit" class="btn btn-sssihl mt-3">Upload &amp; Import</button>
</form>
{% endblock %}
