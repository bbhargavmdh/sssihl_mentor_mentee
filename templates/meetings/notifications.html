{% extends "base.html" %}
{% block content %}
<h4>Notifications</h4>
<ul class="list-group">
  {% for n in page_obj %}
    <li class="list-group-item">
      {{ n.message }}
      <span class="text-muted small d-block">{{ n.created_at }}</span>
    </li>
  {% empty %}
    <li class="list-group-item text-muted">No notifications.</li>
  {% endfor %}
</ul>
{% include "core/_pagination.html" %}
{% endblock %}
